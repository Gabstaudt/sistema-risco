anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">HTTPS e proteção de acesso</text><text x="65" y="511" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Sessão individual por profissional</text><path d="M205 355V390" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="435" y="135" width="380" height="220" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="455" y="169" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Interface web · Next.js / React</text><text x="455" y="202" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Telas por perfil e especialidade</text><text x="455" y="229" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Pacientes, filas e prontuário</text><text x="455" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Formulários, indicadores e relatórios</text><text x="455" y="283" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Impressão de fichas e documentos</text><rect x="435" y="390" width="380" height="190" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="455" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Painel e atualizações ao vivo</text><text x="455" y="457" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Chamada de senhas e consultórios</text><text x="455" y="484" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Filas e situação dos atendimentos</text><text x="455" y="511" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Eventos enviados pelo backend</text><path d="M365 230H435" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><text x="400" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607568">Acesso web</text><path d="M365 485H400V280H435" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="885" y="135" width="580" height="445" rx="14" fill="white" stroke="#3E8A68" stroke-width="2" stroke-dasharray="7 6"/><text x="910" y="171" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1E4A38">Backend · API e regras de negócio</text><rect x="910" y="190" width="530" height="110" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="930" y="224" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Identidade e permissões</text><text x="930" y="257" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Login, sessões, perfis, setores e escopo por paciente</text><rect x="910" y="315" width="530" height="115" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="930" y="349" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Módulos clínicos e operacionais</text><text x="930" y="382" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Atendimentos, triagem, exames e risco pré-operatório</text><text x="930" y="409" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Prescrições, cirurgias, enfermaria e estoque</text><rect x="910" y="445" width="530" height="110" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="930" y="479" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Consistência e rastreabilidade</text><text x="930" y="512" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Validações, transações e trilha de auditoria</text><path d="M815 230H885" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><text x="850" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607568">API HTTPS</text><path d="M885 485H815" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><text x="850" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607568">Eventos</text><rect x="1535" y="135" width="420" height="145" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1555" y="169" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Banco relacional · PostgreSQL</text><text x="1555" y="202" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Pacientes, atendimentos e prontuários</text><text x="1555" y="229" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Usuários, permissões, exames e estoque</text><text x="1555" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Transações e vínculos entre registros</text><rect x="1535" y="310" width="420" height="125" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1555" y="344" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Arquivos · Armazenamento privado</text><text x="1555" y="377" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Resultados, imagens, fotos e documentos</text><text x="1555" y="404" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Acesso autorizado e links temporários</text><rect x="1535" y="465" width="420" height="115" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1555" y="499" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Eventos e tarefas em segundo plano</text><text x="1555" y="532" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Atualizações de filas e processamento</text><text x="1555" y="559" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">de relatórios, exportações e arquivos</text><path d="M1465 207H1535" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1465 372H1535" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1465 520H1535" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="45" y="650" width="770" height="170" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="684" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Módulos atendidos pela mesma plataforma</text><text x="65" y="717" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Recepção e senhas • Triagem • Atendimento médico e especialidades</text><text x="65" y="744" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Laboratório e exames • Enfermaria • Farmácia e estoque</text><text x="65" y="771" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Administração • Indicadores • Relatórios e auditoria</text><rect x="885" y="650" width="580" height="170" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="905" y="684" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Serviços de apoio</text><text x="905" y="717" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Geração de PDFs, receitas, atestados e relatórios</text><text x="905" y="744" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Rotinas agendadas, indicadores e exportações</text><text x="905" y="771" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Integrações futuras, conforme necessidade da unidade</text><path d="M1175 580V650" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="1535" y="650" width="420" height="170" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1555" y="684" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Operação e proteção de dados</text><text x="1555" y="717" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Backups do banco e dos arquivos</text><text x="1555" y="744" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Monitoramento, logs e alertas</text><text x="1555" y="771" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Criptografia e gestão de segredos</text><text x="1555" y="798" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Restauração testada e controle de acesso</text><text x="45" y="881" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Regras centrais da arquitetura</text><text x="45" y="916" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">O backend valida permissões e regras clínicas. O banco e o armazenamento privado são as fontes oficiais dos dados.</text><text x="45" y="947" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">O navegador consome a API; o acesso ao banco e aos arquivos passa pelos controles do servidor. Eventos mantêm as telas sincronizadas.</text><text x="45" y="978" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607568">Proposta: backend modular único inicialmente, com serviços de apoio separados conforme a demanda. Não representa infraestrutura já implantada.</text></svg>