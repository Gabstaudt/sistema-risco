<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1030" viewBox="0 0 2000 1030" role="img" aria-label="Proposta de integração do módulo independente de risco cirúrgico com sistemas externos"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker></defs><rect width="2000" height="1030" fill="white"/><text x="45" y="53" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1E4A38">MedRisk · Integração do módulo de risco cirúrgico</text><text x="45" y="87" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">Proposta futura: um módulo independente, reutilizável e conectado a sistemas hospitalares já existentes</text><text x="45" y="148" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1E4A38">Sistemas de origem</text><rect x="45" y="180" width="365" height="130" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="214" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">MedRisk</text><text x="65" y="248" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Pode consumir o módulo de risco</text><text x="65" y="275" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">pelo mesmo contrato de integração</text><rect x="45" y="350" width="365" height="155" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="384" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Sistemas hospitalares existentes</text><text x="65" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Prontuários eletrônicos e sistemas</text><text x="65" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">de gestão de outras instituições</text><text x="65" y="472" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Mantêm seus próprios fluxos e cadastros</text><rect x="45" y="550" width="365" height="165" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="584" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Acesso pelo sistema de origem</text><text x="65" y="618" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Abre a avaliação do paciente</text><text x="65" y="645" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">por link seguro ou interface incorporada</text><text x="65" y="672" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Retorna ao prontuário após o parecer</text><rect x="490" y="135" width="520" height="615" rx="14" fill="white" stroke="#3E8A68" stroke-width="2" stroke-dasharray="7 6"/><text x="515" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1E4A38">Camada de integração</text><rect x="515" y="200" width="470" height="145" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="535" y="234" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Conector de cada sistema</text><text x="535" y="268" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Adapta o formato dos dados</text><text x="535" y="295" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Relaciona paciente e atendimento</text><text x="535" y="322" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">ao identificador no sistema de origem</text><rect x="515" y="370" width="470" height="160" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="535" y="404" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">API de integração versionada</text><text x="535" y="438" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Recebe solicitações e dados necessários</text><text x="535" y="465" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Permite consultar andamento e resultado</text><text x="535" y="492" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Retorna dados estruturados e parecer</text><rect x="515" y="555" width="470" height="160" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="535" y="589" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Identidade e proteção de acesso</text><text x="535" y="623" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Autenticação entre os sistemas</text><text x="535" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Login integrado ou acesso autorizado</text><text x="535" y="677" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Controle por instituição e profissional</text><path d="M410 245H515" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M410 425H455V280H515" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M410 630H515" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M750 345V370" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><rect x="1090" y="135" width="865" height="615" rx="14" fill="white" stroke="#3E8A68" stroke-width="2" stroke-dasharray="7 6"/><text x="1115" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1E4A38">Módulo independente de risco cirúrgico</text><rect x="1115" y="200" width="815" height="120" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1135" y="234" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Interface própria + serviço de avaliação</text><text x="1135" y="268" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Conferência dos dados e solicitação de complementação</text><text x="1135" y="295" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Escores RCRI, VSG-CRI, EMAPO e ACP / Detsky</text><rect x="1115" y="350" width="815" height="145" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1135" y="384" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Cardiologista responsável</text><text x="1135" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Avalia os escores e o contexto clínico</text><text x="1135" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Registra classificação, justificativa, recomendações e parecer</text><text x="1135" y="472" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">A decisão final permanece sob responsabilidade médica</text><rect x="1115" y="525" width="390" height="185" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1135" y="559" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Persistência do módulo</text><text x="1135" y="593" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Avaliações e dados necessários</text><text x="1135" y="620" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Vínculos com os sistemas de origem</text><text x="1135" y="647" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Histórico de versões e auditoria</text><rect x="1530" y="525" width="400" height="185" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1550" y="559" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Resultado da avaliação</text><text x="1550" y="593" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Classificação e recomendação</text><text x="1550" y="620" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Parecer, autor e data</text><text x="1550" y="647" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Documento para consulta/impressão</text><path d="M985 440H1045V260H1115" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><text x="1050" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607568">Solicitação</text><path d="M1520 320V350" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M1400 495V525" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M1730 495V525" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M1730 710V730H1065V488H985" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M515 488H475V775H425V478H410" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M425 478V286H410" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><text x="775" y="801" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607568">Retorno ao sistema de origem: consulta pela API ou notificação de evento</text><rect x="45" y="840" width="1910" height="145" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="874" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">O que essa integração permite</text><text x="65" y="908" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Cada hospital mantém seu sistema e integra apenas a funcionalidade de risco cirúrgico, sem adotar o MedRisk completo.</text><text x="65" y="935" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">O sistema de origem envia os dados autorizados e recebe status, parecer e resultado vinculados ao paciente e atendimento corretos.</text><text x="65" y="962" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Contratos, campos, identidade integrada e mecanismos de retorno serão definidos na etapa futura de implementação.</text><text x="45" y="1015" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607568">Diagrama conceitual de evolução. A separação do módulo e os conectores de integração ainda não foram implementados.</text></svg>