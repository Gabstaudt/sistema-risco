<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1020" viewBox="0 0 2000 1020" role="img" aria-label="Diagrama central do módulo de cálculo de risco cirúrgico MedRisk"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker></defs><rect width="2000" height="1020" fill="white"/><text x="45" y="53" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1E4A38">MedRisk · Módulo de cálculo de risco cirúrgico</text><text x="45" y="87" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#374151">Visão funcional central · Entradas → escores → avaliação médica → parecer e encaminhamento</text><text x="45" y="145" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1E4A38">1. Entradas</text><rect x="45" y="175" width="390" height="140" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="209" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Solicitação de avaliação</text><text x="65" y="243" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Clínico ou cirurgião solicita o risco</text><text x="65" y="270" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Paciente e atendimento identificados</text><text x="65" y="297" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Cardiologista responsável definido</text><rect x="45" y="345" width="390" height="170" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="379" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Informações do paciente</text><text x="65" y="413" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Anamnese e comorbidades</text><text x="65" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Sinais vitais e histórico clínico</text><text x="65" y="467" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Exames e resultados disponíveis</text><text x="65" y="494" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Medicações e alergias</text><rect x="45" y="545" width="390" height="140" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="579" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Contexto cirúrgico</text><text x="65" y="613" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Tipo de cirurgia e urgência</text><text x="65" y="640" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Condições clínicas atuais</text><text x="65" y="667" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Necessidade de suporte perioperatório</text><rect x="505" y="130" width="950" height="680" rx="14" fill="white" stroke="#3E8A68" stroke-width="2" stroke-dasharray="7 6"/><text x="530" y="169" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1E4A38">2. Núcleo do módulo · Cardiologia</text><rect x="530" y="195" width="900" height="115" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="550" y="229" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Conferência dos dados</text><text x="550" y="263" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Verificar dados disponíveis e pendências antes de concluir a avaliação</text><text x="550" y="290" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Solicitar complementação ou novos exames quando necessário</text><path d="M435 245H530" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M435 430H470V268H530" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M435 615H485V285H530" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><text x="980" y="353" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1E4A38">Cálculo / registro e interpretação dos escores</text><rect x="530" y="385" width="210" height="130" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="550" y="419" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">RCRI</text><text x="550" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Pontuação</text><text x="550" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">e interpretação</text><rect x="760" y="385" width="210" height="130" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="780" y="419" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">VSG-CRI</text><text x="780" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Pontuação</text><text x="780" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">e interpretação</text><rect x="990" y="385" width="210" height="130" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1010" y="419" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">EMAPO</text><text x="1010" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Resultado</text><text x="1010" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">e interpretação</text><rect x="1220" y="385" width="210" height="130" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1240" y="419" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">ACP / Detsky</text><text x="1240" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Resultado</text><text x="1240" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">e interpretação</text><path d="M980 310V329" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M635 385V368H1325V385M865 368V385M1095 368V385" fill="none" stroke="#607568" stroke-width="2"/><path d="M635 515V539H1325V515M865 515V539M1095 515V539" fill="none" stroke="#607568" stroke-width="2"/><path d="M980 539V570" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><rect x="530" y="570" width="900" height="200" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="550" y="604" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Avaliação e validação do cardiologista</text><text x="550" y="638" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Integra os escores com o quadro clínico e o procedimento proposto</text><text x="550" y="665" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Define a classificação final e registra justificativa e recomendações</text><text x="550" y="692" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Indica medidas de cuidado, suporte e encaminhamento especializado</text><text x="550" y="719" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Conclui o parecer ou mantém a avaliação em andamento</text><text x="1525" y="145" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1E4A38">3. Saídas</text><rect x="1525" y="175" width="430" height="170" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1545" y="209" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Parecer de risco cirúrgico</text><text x="1545" y="243" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Classificação final registrada</text><text x="1545" y="270" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Recomendação: aprovar, adiar</text><text x="1545" y="297" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">ou contraindicar</text><text x="1545" y="324" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Observações e responsável pela avaliação</text><rect x="1525" y="385" width="430" height="170" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1545" y="419" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Continuidade do atendimento</text><text x="1545" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Favorável → avaliação anestésica</text><text x="1545" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Pendências → tratar e reavaliar</text><text x="1545" y="507" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Contraindicação → registrar conduta</text><text x="1545" y="534" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Cirurgião consulta o parecer para planejar</text><rect x="1525" y="595" width="430" height="175" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1545" y="629" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Registro e rastreabilidade</text><text x="1545" y="663" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Parecer vinculado ao prontuário</text><text x="1545" y="690" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Resultados e exames de referência</text><text x="1545" y="717" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Profissional, data e histórico de alterações</text><text x="1545" y="744" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Consulta e impressão conforme permissão</text><path d="M1430 630H1485V260H1525" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M1740 345V385" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><path d="M1740 555V595" fill="none" stroke="#607568" stroke-width="2.3" marker-end="url(#a)"/><rect x="45" y="850" width="1910" height="125" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="884" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Limites e responsabilidades</text><text x="65" y="918" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Clínico e cirurgião solicitam o risco; o cardiologista avalia, registra e altera o parecer. A classificação ASA fica no módulo do anestesista.</text><text x="65" y="945" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Os escores apoiam a decisão médica. Cálculo automático e registro manual são diferenciados conforme o escore e o protocolo adotado.</text></svg>