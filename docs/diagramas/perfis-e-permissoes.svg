<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1050" viewBox="0 0 2000 1050" role="img" aria-label="Diagrama de perfis e permissões do MedRisk"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker></defs><rect width="2000" height="1050" fill="white"/><text x="45" y="53" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#1E4A38">MedRisk · Perfis e permissões</text><text x="45" y="85" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Visão resumida dos acessos e responsabilidades no sistema</text><rect x="45" y="115" width="1910" height="130" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="65" y="149" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Administrador</text><text x="65" y="182" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Cria usuários e perfis • Configura permissões, setores, unidade e exames</text><text x="65" y="209" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Consulta indicadores, auditoria e relatórios • Exporta dados • Visualiza outros perfis em modo de consulta</text><path d="M1000 245V265H495V291" fill="none" stroke="#607568" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000 265H1460V291" fill="none" stroke="#607568" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="300" width="900" height="590" rx="14" fill="white" stroke="#3E8A68" stroke-width="2" stroke-dasharray="7 6"/><text x="70" y="337" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1E4A38">Perfis operacionais</text><rect x="70" y="365" width="415" height="225" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="90" y="399" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Recepção</text><text x="90" y="432" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Pesquisa, cadastra e atualiza pacientes</text><text x="90" y="459" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Chama senhas e registra atendimentos</text><text x="90" y="486" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Encaminha, cancela e imprime fichas</text><text x="90" y="552" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#755B32">Sem acesso à triagem, avaliações</text><text x="90" y="575" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#755B32">médicas e histórico de atendimentos</text><rect x="505" y="365" width="415" height="225" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="525" y="399" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Triagem</text><text x="525" y="432" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Chama senhas e pesquisa pacientes</text><text x="525" y="459" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Registra anamnese, sinais e Manchester</text><text x="525" y="486" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Encaminha para setores e imprime ficha</text><text x="525" y="552" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#755B32">Sem histórico de execução do sistema</text><rect x="70" y="610" width="270" height="250" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="90" y="644" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Laboratório</text><text x="90" y="677" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Consulta pacientes e pedidos</text><text x="90" y="704" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Registra coleta e realização</text><text x="90" y="731" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Anexa e libera resultados</text><text x="90" y="758" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Registra medicação aplicada</text><rect x="360" y="610" width="270" height="250" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="380" y="644" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Enfermaria</text><text x="380" y="677" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Sinais vitais e observações</text><text x="380" y="704" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Reavaliação e medicações</text><text x="380" y="731" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Entrada e alta da enfermaria</text><text x="380" y="822" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#755B32">Pacientes do próprio setor</text><rect x="650" y="610" width="270" height="250" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="670" y="644" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Farmácia</text><text x="670" y="677" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Produtos e fornecedores</text><text x="670" y="704" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Estoque, lotes e vencimentos</text><text x="670" y="731" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Separa medicamentos</text><text x="670" y="758" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Movimentações e CSV</text><rect x="975" y="300" width="980" height="590" rx="14" fill="white" stroke="#3E8A68" stroke-width="2" stroke-dasharray="7 6"/><text x="1000" y="337" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1E4A38">Médico → especialidade</text><rect x="1000" y="355" width="930" height="100" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1020" y="384" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1E4A38">Permissões comuns aos médicos</text><text x="1020" y="412" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Consulta, anamnese, exames, receitas, atestados e impressões</text><text x="1020" y="438" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Consultório, disponibilidade e encaminhamento para outro médico ou setor</text><rect x="1000" y="475" width="455" height="180" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1020" y="509" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Clínico</text><text x="1020" y="542" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Avaliação clínica e tipo de lesão</text><text x="1020" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Solicita risco cirúrgico e especialistas</text><text x="1020" y="596" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Solicita e cadastra tipos de exames</text><rect x="1475" y="475" width="455" height="180" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1495" y="509" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Cardiologista</text><text x="1495" y="542" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Avalia e registra o risco cirúrgico</text><text x="1495" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">RCRI • VSG-CRI • EMAPO • ACP</text><text x="1495" y="596" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Emite parecer cardiológico</text><rect x="1000" y="675" width="455" height="190" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1020" y="709" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Anestesista</text><text x="1020" y="742" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Avaliação pré-anestésica</text><text x="1020" y="769" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Classificação ASA</text><text x="1020" y="796" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Parecer e aptidão para anestesia</text><rect x="1475" y="675" width="455" height="190" rx="14" fill="white" stroke="#3E8A68" stroke-width="2"/><text x="1495" y="709" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E4A38">Cirurgião</text><text x="1495" y="742" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Solicita e consulta o risco cirúrgico</text><text x="1495" y="769" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Planeja e registra cirurgia e pós-operatório</text><text x="1495" y="796" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Solicita e cadastra tipos de exames</text><text x="45" y="932" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1E4A38">Regras de acesso</text><text x="45" y="964" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Médicos visualizam os pacientes direcionados a eles. A avaliação do risco cirúrgico pertence ao cardiologista; a ASA, ao anestesista.</text><text x="45" y="995" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#374151">Perfis personalizados têm permissões configuráveis. Administração gerencia os acessos; cada profissional atua conforme sua autorização.</text><text x="45" y="1025" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607568">A administração de medicação é registrada uma única vez, com baixa do estoque vinculada ao registro autorizado.</text></svg>